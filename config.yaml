# Manual engine example only. scripts/build.sh generates the complete production
# configuration from every discovered v2fly data file.
global:
  enable_gh_proxy: false
  gh_proxy: ""
  split_cnip: false
  singbox:      {enable: true, single_file: true, json: false, srs: true}
  mihomo:       {enable: true, single_file: true, txt: false, yaml: true, mrs: false}
  v2ray:        {enable: false, single_file: true}
  surge:        {enable: true, single_file: true}
  loon:         {enable: true, single_file: true}
  stash:        {enable: false, single_file: true}
  egern:        {enable: false, single_file: true}
  shadowrocket: {enable: true, single_file: true}
  quantumultx:  {enable: true, single_file: true}

# Inputs are generated into add/*.list by scripts/prepare-inputs.sh.
# The source projects remain responsible for rule classification accuracy.
categories:
  - name: cn
    upstreams: []

  - name: private
    upstreams: []

  - name: geolocation-not-cn
    upstreams: []

  - name: category-ads-all
    upstreams: []

  - name: cn-ip
    upstreams: []
